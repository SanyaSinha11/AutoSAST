<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#0A2647" opacity="0.95"/>
  
  <!-- Outer Glow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00D9FF" stroke-width="3" opacity="0.3"/>
  
  <!-- Shield Base -->
  <path d="M 256 80 L 380 140 L 380 260 Q 380 360 256 432 Q 132 360 132 260 L 132 140 Z" 
        fill="#144272" stroke="#00D9FF" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Shield Highlight -->
  <path d="M 256 80 L 380 140 L 380 260 Q 380 360 256 432 Q 132 360 132 260 L 132 140 Z" 
        fill="url(#shieldGradient)" opacity="0.15"/>
  
  <!-- Neural Network / Circuit Pattern (Brain-like AI) -->
  <!-- Center Node -->
  <circle cx="256" cy="240" r="18" fill="#00D9FF" opacity="0.9">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Top Left Node -->
  <circle cx="200" cy="180" r="10" fill="#00D9FF" opacity="0.7"/>
  <line x1="200" y1="180" x2="246" y2="227" stroke="#00D9FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Top Right Node -->
  <circle cx="312" cy="180" r="10" fill="#00D9FF" opacity="0.7"/>
  <line x1="312" y1="180" x2="266" y2="227" stroke="#00D9FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Middle Left Node -->
  <circle cx="180" cy="240" r="10" fill="#00D9FF" opacity="0.7"/>
  <line x1="180" y1="240" x2="238" y2="240" stroke="#00D9FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Middle Right Node -->
  <circle cx="332" cy="240" r="10" fill="#00D9FF" opacity="0.7"/>
  <line x1="332" y1="240" x2="274" y2="240" stroke="#00D9FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Bottom Left Node -->
  <circle cx="200" cy="300" r="10" fill="#00D9FF" opacity="0.7"/>
  <line x1="200" y1="300" x2="246" y2="253" stroke="#00D9FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Bottom Right Node -->
  <circle cx="312" cy="300" r="10" fill="#00D9FF" opacity="0.7"/>
  <line x1="312" y1="300" x2="266" y2="253" stroke="#00D9FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Secondary Nodes (smaller) -->
  <circle cx="220" cy="210" r="6" fill="#FF6B35" opacity="0.6"/>
  <circle cx="292" cy="210" r="6" fill="#FF6B35" opacity="0.6"/>
  <circle cx="220" cy="270" r="6" fill="#FF6B35" opacity="0.6"/>
  <circle cx="292" cy="270" r="6" fill="#FF6B35" opacity="0.6"/>
  
  <!-- Scanner/Magnifying Glass -->
  <g transform="translate(256, 340)">
    <!-- Magnifying Glass Circle -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#00D9FF" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="#00D9FF" opacity="0.1"/>
    
    <!-- Handle -->
    <line x1="20" y1="20" x2="38" y2="38" stroke="#00D9FF" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Code Brackets inside magnifying glass -->
    <text x="-12" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#00D9FF">&lt;/&gt;</text>
  </g>
  
  <!-- Scanning Beam Effect (Animated) -->
  <g opacity="0.6">
    <line x1="256" y1="150" x2="256" y2="320" stroke="#FF6B35" stroke-width="2" opacity="0.8">
      <animate attributeName="y1" values="150;320;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="170;340;170" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Lock/Security Icon (Top of Shield) -->
  <g transform="translate(256, 130)">
    <rect x="-10" y="0" width="20" height="16" rx="2" fill="#00D9FF" opacity="0.8"/>
    <path d="M -6 0 L -6 -8 Q -6 -14 0 -14 Q 6 -14 6 -8 L 6 0" 
          fill="none" stroke="#00D9FF" stroke-width="3" opacity="0.8"/>
  </g>
  
  <!-- Subtle Code Pattern Background -->
  <text x="150" y="380" font-family="monospace" font-size="10" fill="#00D9FF" opacity="0.15">
    if(vuln) { analyze(); }
  </text>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>
